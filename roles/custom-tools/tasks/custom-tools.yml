---
- name: Install tools for demo
  community.general.homebrew:
    name:
      - imagemagick
      - gifsicle
    state: present
  tags:
    - demo
    - custom-tools

- name: Install custom tools
  community.general.homebrew:
    name: "{{ custom_user_tools }}"
    state: present
  tags:
    - custom-tools
    - install

- name: Install custom casks
  community.general.homebrew_cask:
    name: "{{ custom_user_casks }}"
    state: present
  when: custom_user_casks | length > 0
  tags:
    - custom-tools
    - install

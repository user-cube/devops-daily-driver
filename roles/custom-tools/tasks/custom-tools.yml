---
- name: Install tools for demo
  community.general.homebrew:
    name:
      - imagemagick
      - gifsicle
    state: present
  tags:
    - demo
    - custom-tools

- name: Add tap repositories for custom tools
  community.general.homebrew_tap:
    name: "{{ custom_user_taps }}"
    state: present
  tags:
    - custom-tools
    - install

- name: Trust custom tools from user taps
  ansible.builtin.command: >-
    brew trust --formula {{ custom_user_tools | join(' ') }}
  register: custom_tools_trust
  changed_when: "'Trusted ' in custom_tools_trust.stdout"
  when: custom_user_tools | length > 0
  tags:
    - custom-tools
    - install

- name: Install custom tools
  community.general.homebrew:
    name: "{{ custom_user_tools }}"
    state: present
  tags:
    - custom-tools
    - install

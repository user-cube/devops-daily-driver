---
- name: Configure macOS Dock
  tags: macos, dock
  block:
    - name: Set Dock size (small)
      community.general.osx_defaults:
        domain: com.apple.dock
        key: tilesize
        type: float
        value: 22
      notify: Restart Dock

    - name: Disable Dock magnification
      community.general.osx_defaults:
        domain: com.apple.dock
        key: magnification
        type: bool
        value: false
      notify: Restart Dock

    - name: Set Dock position to right
      community.general.osx_defaults:
        domain: com.apple.dock
        key: orientation
        type: string
        value: right
      notify: Restart Dock

    - name: Set minimize window effect to Genie
      community.general.osx_defaults:
        domain: com.apple.dock
        key: mineffect
        type: string
        value: genie
      notify: Restart Dock

    - name: Disable minimize windows into application icon
      community.general.osx_defaults:
        domain: com.apple.dock
        key: minimize-to-application
        type: bool
        value: false
      notify: Restart Dock

    - name: Disable Dock auto-hide
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide
        type: bool
        value: false
      notify: Restart Dock

    - name: Enable animate opening applications
      community.general.osx_defaults:
        domain: com.apple.dock
        key: launchanim
        type: bool
        value: true
      notify: Restart Dock

    - name: Show indicators for open applications
      community.general.osx_defaults:
        domain: com.apple.dock
        key: show-process-indicators
        type: bool
        value: true
      notify: Restart Dock

    - name: Disable show recent apps in Dock
      community.general.osx_defaults:
        domain: com.apple.dock
        key: show-recents
        type: bool
        value: false
      notify: Restart Dock

    - name: Disable the bottom-right hot corner (Quick Note)
      community.general.osx_defaults:
        domain: com.apple.dock
        key: wvous-br-corner
        type: int
        value: 1
      notify: Restart Dock

    - name: Clear the bottom-right hot corner modifier
      community.general.osx_defaults:
        domain: com.apple.dock
        key: wvous-br-modifier
        type: int
        value: 0
      notify: Restart Dock

    - name: Disable automatically rearranging Spaces (keeps AeroSpace stable)
      community.general.osx_defaults:
        domain: com.apple.dock
        key: mru-spaces
        type: bool
        value: false
      notify: Restart Dock
      tags: [aerospace]

    - name: Click wallpaper to reveal desktop only in Stage Manager
      community.general.osx_defaults:
        domain: com.apple.WindowManager
        key: EnableStandardClickToShowDesktop
        type: bool
        value: false

- name: Configure macOS Menu Bar
  tags: macos, menubar
  block:
    - name: Always show Sound in the menu bar
      community.general.osx_defaults:
        domain: com.apple.controlcenter
        host: currentHost
        key: Sound
        type: int
        value: 18
      notify: Restart Control Center
      tags: [aerospace]

- name: Configure macOS Finder
  tags: macos, finder
  block:
    - name: Show all filename extensions
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: AppleShowAllExtensions
        type: bool
        value: true
      notify: Restart Finder

    - name: Show hidden files
      community.general.osx_defaults:
        domain: com.apple.finder
        key: AppleShowAllFiles
        type: bool
        value: true
      notify: Restart Finder

    - name: Show path bar
      community.general.osx_defaults:
        domain: com.apple.finder
        key: ShowPathbar
        type: bool
        value: true
      notify: Restart Finder

    - name: Show status bar
      community.general.osx_defaults:
        domain: com.apple.finder
        key: ShowStatusBar
        type: bool
        value: true
      notify: Restart Finder

    - name: Keep folders on top when sorting by name
      community.general.osx_defaults:
        domain: com.apple.finder
        key: _FXSortFoldersFirst
        type: bool
        value: true
      notify: Restart Finder

    - name: Search the current folder by default
      community.general.osx_defaults:
        domain: com.apple.finder
        key: FXDefaultSearchScope
        type: string
        value: SCcf
      notify: Restart Finder

    - name: Disable the warning when changing a file extension
      community.general.osx_defaults:
        domain: com.apple.finder
        key: FXEnableExtensionChangeWarning
        type: bool
        value: false
      notify: Restart Finder

    - name: Don't write .DS_Store files on network shares
      community.general.osx_defaults:
        domain: com.apple.desktopservices
        key: DSDontWriteNetworkStores
        type: bool
        value: true
      notify: Restart Finder

    - name: Don't write .DS_Store files on USB drives
      community.general.osx_defaults:
        domain: com.apple.desktopservices
        key: DSDontWriteUSBStores
        type: bool
        value: true
      notify: Restart Finder

    - name: Use list view by default
      community.general.osx_defaults:
        domain: com.apple.finder
        key: FXPreferredViewStyle
        type: string
        value: clmv
      notify: Restart Finder

- name: Configure macOS Appearance
  tags: macos, appearance
  block:
    # Takes effect for already-open apps after logging out and back in
    - name: Use dark mode
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: AppleInterfaceStyle
        type: string
        value: Dark

- name: Configure macOS Keyboard
  tags: macos, keyboard
  block:
    - name: Enable full keyboard access for all controls
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: AppleKeyboardUIMode
        type: int
        value: 1

    - name: Enable automatic capitalization
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: NSAutomaticCapitalizationEnabled
        type: bool
        value: true

    - name: Enable automatic period substitution
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: NSAutomaticPeriodSubstitutionEnabled
        type: bool
        value: true

    # Only rewrite the hotkeys when at least one of them is still enabled,
    # otherwise these two tasks report "changed" on every single run.
    - name: Check whether Spotlight shortcuts are already disabled
      ansible.builtin.shell: |
        p=~/Library/Preferences/com.apple.symbolichotkeys.plist
        for k in 60 61 64 65; do
          v=$(/usr/libexec/PlistBuddy -c "Print :AppleSymbolicHotKeys:$k:enabled" \
                "$p" 2>/dev/null)
          [ "$v" = "false" ] || { echo enabled; exit 0; }
        done
        echo disabled
      register: spotlight_hotkeys
      changed_when: false
      check_mode: false

    - name: Disable Spotlight shortcuts to free ⌘Space for Raycast
      ansible.builtin.shell: |
        defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys -dict-add 60 "
          <dict>
            <key>enabled</key><false/>
            <key>value</key><dict>
              <key>parameters</key><array><integer>32</integer><integer>49</integer><integer>262144</integer></array>
              <key>type</key><string>standard</string>
            </dict>
          </dict>"
        defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys -dict-add 61 "
          <dict>
            <key>enabled</key><false/>
            <key>value</key><dict>
              <key>parameters</key><array><integer>32</integer><integer>49</integer><integer>786432</integer></array>
              <key>type</key><string>standard</string>
            </dict>
          </dict>"
        defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys -dict-add 64 "
          <dict>
            <key>enabled</key><false/>
            <key>value</key><dict>
              <key>parameters</key><array><integer>32</integer><integer>49</integer><integer>1048576</integer></array>
              <key>type</key><string>standard</string>
            </dict>
          </dict>"
        defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys -dict-add 65 "
          <dict>
            <key>enabled</key><false/>
            <key>value</key><dict>
              <key>parameters</key><array><integer>32</integer><integer>49</integer><integer>1572864</integer></array>
              <key>type</key><string>standard</string>
            </dict>
          </dict>"
      when: spotlight_hotkeys.stdout == "enabled"
      changed_when: true

    - name: Check whether Mission Control ctrl ←/→ are already disabled
      ansible.builtin.shell: |
        p=~/Library/Preferences/com.apple.symbolichotkeys.plist
        for k in 79 81; do
          v=$(/usr/libexec/PlistBuddy -c "Print :AppleSymbolicHotKeys:$k:enabled" \
                "$p" 2>/dev/null)
          [ "$v" = "false" ] || { echo enabled; exit 0; }
        done
        echo disabled
      register: mission_control_hotkeys
      changed_when: false
      check_mode: false
      tags: [aerospace]

    - name: Disable Mission Control ctrl ←/→ to free them for AeroSpace
      ansible.builtin.shell: |
        defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys -dict-add 79 "
          <dict>
            <key>enabled</key><false/>
            <key>value</key><dict>
              <key>parameters</key><array><integer>65535</integer><integer>123</integer><integer>8650752</integer></array>
              <key>type</key><string>standard</string>
            </dict>
          </dict>"
        defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys -dict-add 81 "
          <dict>
            <key>enabled</key><false/>
            <key>value</key><dict>
              <key>parameters</key><array><integer>65535</integer><integer>124</integer><integer>8650752</integer></array>
              <key>type</key><string>standard</string>
            </dict>
          </dict>"
      when: mission_control_hotkeys.stdout == "enabled"
      changed_when: true
      tags: [aerospace]

    - name: Apply shortcut changes
      ansible.builtin.command: /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u
      when: >-
        (spotlight_hotkeys.stdout | default('')) == "enabled" or
        (mission_control_hotkeys.stdout | default('')) == "enabled"
      changed_when: true
      tags: [aerospace]

    # Siri's shortcut defaults to holding ⌘Space and swallows the keystroke
    # before any app sees it. Disabling Siri frees it for Raycast.
    - name: Disable Siri to free ⌘Space
      community.general.osx_defaults:
        domain: com.apple.assistant.support
        key: "Assistant Enabled"
        type: bool
        value: false

# Raycast has no supported defaults key for its global hotkey; it is kept in an
# encrypted internal database. Set ⌘Space by hand in
# Raycast > Settings > General > Raycast Hotkey.

---
- name: Restart Control Center
  ansible.builtin.command: killall ControlCenter
  changed_when: true

- name: Restart Dock
  ansible.builtin.command: killall Dock
  changed_when: true

- name: Restart Finder
  ansible.builtin.command: killall Finder
  changed_when: true

# screencaptureui (the ⌘⇧5 app) only runs while in use
- name: Restart SystemUIServer
  ansible.builtin.shell: killall SystemUIServer; killall screencaptureui 2>/dev/null || true
  changed_when: true

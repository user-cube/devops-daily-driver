---
- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    update: true
  tags:
    - dotfiles
    - install
    - aerospace

- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config"
    state: directory
    mode: "0755"
  tags:
    - dotfiles
    - install
    - aerospace

- name: Sync dotfiles .config to ~/.config
  ansible.posix.synchronize:
    src: "{{ dotfiles_dest }}/.config/"
    dest: "{{ home_dir }}/.config/"
    delete: false
  notify:
    - Reload tmux config
    - Reload AeroSpace
    - Restart borders
    - Reload sketchybar
  tags:
    - dotfiles
    - install
    - aerospace

# SketchyBar's app icon map is not in the dotfiles repo: it comes from the
# sketchybar-app-font release of the installed font version (latest before the
# font is installed, then replaced on the next run).
- name: Download the SketchyBar app icon map
  ansible.builtin.command: "{{ home_dir }}/.config/sketchybar/fetch-icon-map.sh"
  register: icon_map_fetch
  changed_when: "'downloaded' in icon_map_fetch.stdout"
  notify:
    - Reload sketchybar
  tags:
    - dotfiles
    - install
    - aerospace

# ~/.ssh/config stays per machine (hosts, users, keys); only this Include line
# is managed, at the top so its `Host *` defaults (ControlMaster) apply everywhere.
- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.ssh"
    state: directory
    mode: "0700"
  tags:
    - dotfiles
    - install
    - ssh

- name: Include the dotfiles ssh config from ~/.ssh/config
  ansible.builtin.lineinfile:
    path: "{{ home_dir }}/.ssh/config"
    line: "Include ~/.config/ssh/*.conf"
    insertbefore: BOF
    create: true
    mode: "0600"
  tags:
    - dotfiles
    - install
    - ssh

- name: Copy .zshrc to ~/.zshrc
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/.zshrc"
    dest: "{{ home_dir }}/.zshrc"
    remote_src: true
    mode: "0644"
  tags:
    - dotfiles
    - install

- name: Copy .p10k.zsh to ~/.p10k.zsh
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/.p10k.zsh"
    dest: "{{ home_dir }}/.p10k.zsh"
    remote_src: true
    mode: "0644"
  tags:
    - dotfiles
    - install

- name: Sync dotfiles git_hooks to ~/git_hooks
  ansible.posix.synchronize:
    src: "{{ dotfiles_dest }}/git_hooks/"
    dest: "{{ home_dir }}/git_hooks/"
    delete: false
  tags:
    - dotfiles
    - install

# Claude Code: settings, global instructions and hooks. The repo keeps them in
# claude/, not .claude/, which Claude Code would read as the repo's own settings.
- name: Sync dotfiles claude to ~/.claude
  ansible.posix.synchronize:
    src: "{{ dotfiles_dest }}/claude/"
    dest: "{{ home_dir }}/.claude/"
    delete: false
  tags:
    - dotfiles
    - install

# .gitconfig runs this binary on every commit (hook.commit-msg-go), so it has to
# exist before the first commit. dev-tools installs go too, but runs after this.
- name: Install go (builds the commit-msg hook)
  community.general.homebrew:
    name: go
    state: present
  tags:
    - dotfiles
    - install

- name: Build the commit-msg hook
  ansible.builtin.shell: |
    [ commit-msg -nt commit-msg.go ] && exit 0
    /opt/homebrew/bin/go build -o commit-msg commit-msg.go && echo built
  args:
    chdir: "{{ home_dir }}/git_hooks/go/commit-msg"
  register: commit_msg_build
  changed_when: "'built' in commit_msg_build.stdout"
  tags:
    - dotfiles
    - install

# local-backup / local-restore (Bitwarden), and the local-restore tag below.
# Rebuilt when any .go file is newer than the binary.
- name: Build local-files
  ansible.builtin.shell: |
    [ -x local-files ] && [ -z "$(find . -name '*.go' -newer local-files)" ] && exit 0
    /opt/homebrew/bin/go build -o local-files . && echo built
  args:
    chdir: "{{ home_dir }}/.config/dotfiles/local-files"
  register: local_files_build
  changed_when: "'built' in local_files_build.stdout"
  tags:
    - dotfiles
    - install

# SketchyBar's `checks` item (connectivity checks) runs this Go program.
- name: Build the SketchyBar checks
  ansible.builtin.shell: |
    [ -x check ] && [ -z "$(find . -name '*.go' -newer check)" ] && exit 0
    /opt/homebrew/bin/go build -o check . && echo built
  args:
    chdir: "{{ home_dir }}/.config/sketchybar/plugins/check"
  register: sketchybar_check_build
  changed_when: "'built' in sketchybar_check_build.stdout"
  notify:
    - Reload sketchybar
  tags:
    - dotfiles
    - install

# Claude Code's PreToolUse hook (claude/settings.json): until it is built,
# Claude Code's Bash and Read tools are blocked. Rebuilt like local-files.
- name: Build the Claude Code deny-sensitive-reads hook
  ansible.builtin.shell: |
    [ -x deny-sensitive-reads ] && [ -z "$(find . -name '*.go' -newer deny-sensitive-reads)" ] && exit 0
    /opt/homebrew/bin/go build -o deny-sensitive-reads . && echo built
  args:
    chdir: "{{ home_dir }}/.claude/hooks/deny-sensitive-reads"
  register: claude_hook_build
  changed_when: "'built' in claude_hook_build.stdout"
  tags:
    - dotfiles
    - install

- name: Check which gitconfig files exist in dotfiles
  ansible.builtin.stat:
    path: "{{ dotfiles_dest }}/{{ item }}"
  register: gitconfig_files_check
  loop:
    - .gitconfig-personal
    - .gitconfig-work
    - .gitconfig
  tags:
    - dotfiles
    - install

# .gitconfig-work keeps a redacted placeholder in the public dotfiles repo, so
# the real address is filled in locally and has to survive a run. The other
# two are owned by the repo and get overwritten as usual.
- name: Copy gitconfig files from dotfiles to HOME
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/{{ item.item }}"
    dest: "{{ home_dir }}/{{ item.item }}"
    remote_src: true
    mode: "0644"
    force: "{{ item.item != '.gitconfig-work' }}"
  loop: "{{ gitconfig_files_check.results }}"
  when: item.stat.exists | default(false)
  tags:
    - dotfiles
    - install

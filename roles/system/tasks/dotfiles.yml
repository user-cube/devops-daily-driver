---
- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    update: true
  tags:
    - dotfiles
    - install
    - aerospace

- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config"
    state: directory
    mode: "0755"
  tags:
    - dotfiles
    - install
    - aerospace

- name: Sync dotfiles .config to ~/.config
  ansible.posix.synchronize:
    src: "{{ dotfiles_dest }}/.config/"
    dest: "{{ home_dir }}/.config/"
    delete: false
  notify:
    - Reload tmux config
    - Reload Rex config
    - Reload AeroSpace
    - Restart borders
    - Reload sketchybar
  tags:
    - dotfiles
    - install
    - aerospace

# ~/.ssh/config stays per machine (hosts, users, keys); only this Include line
# is managed, at the top so its `Host *` defaults (ControlMaster) apply everywhere.
- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.ssh"
    state: directory
    mode: "0700"
  tags:
    - dotfiles
    - install
    - ssh

- name: Include the dotfiles ssh config from ~/.ssh/config
  ansible.builtin.lineinfile:
    path: "{{ home_dir }}/.ssh/config"
    line: "Include ~/.config/ssh/*.conf"
    insertbefore: BOF
    create: true
    mode: "0600"
  tags:
    - dotfiles
    - install
    - ssh

- name: Copy .zshrc to ~/.zshrc
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/.zshrc"
    dest: "{{ home_dir }}/.zshrc"
    remote_src: true
    mode: "0644"
  tags:
    - dotfiles
    - install

- name: Copy .p10k.zsh to ~/.p10k.zsh
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/.p10k.zsh"
    dest: "{{ home_dir }}/.p10k.zsh"
    remote_src: true
    mode: "0644"
  tags:
    - dotfiles
    - install

- name: Sync dotfiles git_hooks to ~/git_hooks
  ansible.posix.synchronize:
    src: "{{ dotfiles_dest }}/git_hooks/"
    dest: "{{ home_dir }}/git_hooks/"
    delete: false
  tags:
    - dotfiles
    - install

# Claude Code: settings, global instructions and hooks. The repo keeps them in
# claude/, not .claude/, which Claude Code would read as the repo's own settings.
- name: Sync dotfiles claude to ~/.claude
  ansible.posix.synchronize:
    src: "{{ dotfiles_dest }}/claude/"
    dest: "{{ home_dir }}/.claude/"
    delete: false
  tags:
    - dotfiles
    - install

# .gitconfig runs this binary on every commit (hook.commit-msg-go), so it has to
# exist before the first commit. dev-tools installs go too, but runs after this.
- name: Install go (builds the dotfiles Go tools)
  community.general.homebrew:
    name: go
    state: present
  tags:
    - dotfiles
    - install

# Everything after the files are in place, the same steps dotfiles-sync runs
# (dotfiles .config/dotfiles/install.sh): build the Go tools (commit-msg hook,
# local-files, SketchyBar checks, Claude Code hook: Claude Code's Bash and
# Read are blocked until it is built), the SketchyBar icon map, the Hue VS Code
# extension, and removing the files the repo no longer installs.
- name: Build and install the dotfiles tools
  ansible.builtin.command: "{{ home_dir }}/.config/dotfiles/install.sh"
  register: dotfiles_install
  changed_when: "dotfiles_install.stdout is search('^(built|removed|icon_map.sh: downloaded|hue: installed)', multiline=True)"
  notify:
    - Reload sketchybar
  tags:
    - dotfiles
    - install

- name: Check which gitconfig files exist in dotfiles
  ansible.builtin.stat:
    path: "{{ dotfiles_dest }}/{{ item }}"
  register: gitconfig_files_check
  loop:
    - .gitconfig-hooks
    - .gitconfig-personal-github
    - .gitconfig-personal-gitlab
    - .gitconfig-work
    - .gitconfig
  tags:
    - dotfiles
    - install

# .gitconfig-work keeps a redacted placeholder in the public dotfiles repo, so
# the real address is filled in locally and has to survive a run. The other
# two are owned by the repo and get overwritten as usual.
- name: Copy gitconfig files from dotfiles to HOME
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/{{ item.item }}"
    dest: "{{ home_dir }}/{{ item.item }}"
    remote_src: true
    mode: "0644"
    force: "{{ item.item != '.gitconfig-work' }}"
  loop: "{{ gitconfig_files_check.results }}"
  when: item.stat.exists | default(false)
  tags:
    - dotfiles
    - install

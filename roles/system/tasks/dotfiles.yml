---
- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    update: true
  tags:
    - dotfiles
    - install
    - aerospace

- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config"
    state: directory
    mode: "0755"
  tags:
    - dotfiles
    - install
    - aerospace

- name: Sync dotfiles .config to ~/.config
  ansible.posix.synchronize:
    src: "{{ dotfiles_dest }}/.config/"
    dest: "{{ home_dir }}/.config/"
    delete: false
  notify:
    - Reload tmux config
    - Reload Rex config
    - Reload AeroSpace
    - Restart borders
    - Reload sketchybar
  tags:
    - dotfiles
    - install
    - aerospace

# ~/.ssh/config stays per machine (hosts, users, keys); only this Include line
# is managed, at the top so its `Host *` defaults (ControlMaster) apply everywhere.
- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.ssh"
    state: directory
    mode: "0700"
  tags:
    - dotfiles
    - install
    - ssh

- name: Include the dotfiles ssh config from ~/.ssh/config
  ansible.builtin.lineinfile:
    path: "{{ home_dir }}/.ssh/config"
    line: "Include ~/.config/ssh/*.conf"
    insertbefore: BOF
    create: true
    mode: "0600"
  tags:
    - dotfiles
    - install
    - ssh

# The files of the dotfiles' root copied to ~ (.zshrc, .p10k.zsh, the git
# configs), overwriting them: the dotfiles' one list, .config/dotfiles/home-files,
# which dotfiles-sync reads too. A file added there is copied here as well.
# In --check the clone isn't pulled, so an older one may not have the list yet:
# the copy is skipped then; a real run pulls first, and a missing list fails it
- name: Read the dotfiles home-files list
  ansible.builtin.slurp:
    src: "{{ dotfiles_dest }}/.config/dotfiles/home-files"
  register: dotfiles_home_files
  failed_when: dotfiles_home_files is failed and not ansible_check_mode
  tags:
    - dotfiles
    - install

- name: Copy the dotfiles home files to HOME
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/{{ item }}"
    dest: "{{ home_dir }}/{{ item }}"
    remote_src: true
    mode: "0644"
  loop: "{{ dotfiles_home_files.content | b64decode | split('\n') | map('trim') | reject('match', '^(#|$)') | list }}"
  when: dotfiles_home_files.content is defined
  tags:
    - dotfiles
    - install

# .gitconfig-work keeps a redacted placeholder in the public dotfiles repo, so
# the real address is filled in locally and has to survive a run: seeded only
# when missing (it is not in home-files for that reason)
- name: Seed ~/.gitconfig-work
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/.gitconfig-work"
    dest: "{{ home_dir }}/.gitconfig-work"
    remote_src: true
    mode: "0644"
    force: false
  tags:
    - dotfiles
    - install

- name: Sync dotfiles git_hooks to ~/git_hooks
  ansible.posix.synchronize:
    src: "{{ dotfiles_dest }}/git_hooks/"
    dest: "{{ home_dir }}/git_hooks/"
    delete: false
  tags:
    - dotfiles
    - install

# Claude Code: settings, global instructions and hooks. The repo keeps them in
# claude/, not .claude/, which Claude Code would read as the repo's own settings.
- name: Sync dotfiles claude to ~/.claude
  ansible.posix.synchronize:
    src: "{{ dotfiles_dest }}/claude/"
    dest: "{{ home_dir }}/.claude/"
    delete: false
  tags:
    - dotfiles
    - install

# .gitconfig runs this binary on every commit (hook.commit-msg-go), so it has to
# exist before the first commit. dev-tools installs go too, but runs after this.
- name: Install go (builds the dotfiles Go tools)
  community.general.homebrew:
    name: go
    state: present
  tags:
    - dotfiles
    - install

# Everything after the files are in place, the same steps dotfiles-sync runs
# (dotfiles .config/dotfiles/install.sh): build the Go tools (the commit-msg and
# sops-guard hooks, kube-guard, local-files, SketchyBar checks, Claude Code hook:
# commits stop until sops-guard is built, Claude Code's Bash and Read until its
# hook is), the SketchyBar icon map, the VS Code extensions and settings links,
# lazygit's config link, the LaunchAgents, Rex's Settings, and removing the
# files the repo no longer installs. Changed: any of the lines it prints for one.
- name: Build and install the dotfiles tools
  ansible.builtin.command: "{{ home_dir }}/.config/dotfiles/install.sh"
  register: dotfiles_install
  changed_when: dotfiles_install.stdout is search(system_install_changed, multiline=True)
  vars:
    system_install_changed: >-
      ^(built|removed|linked|installed LaunchAgent|icon_map.sh: downloaded|hue: installed|VS Code: (installed|kept)|Rex: )
  notify:
    - Reload sketchybar
  tags:
    - dotfiles
    - install

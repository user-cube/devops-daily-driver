---
- name: Reload AeroSpace
  ansible.builtin.command: aerospace reload-config
  changed_when: true
  failed_when: false

- name: Restart borders
  ansible.builtin.command: brew services restart borders
  changed_when: true
  failed_when: false

- name: Reload sketchybar
  ansible.builtin.command: sketchybar --reload
  changed_when: true
  failed_when: false

# No-op when no tmux server is running (it reads the config on next start)
- name: Reload tmux config
  ansible.builtin.shell: |
    if tmux list-sessions >/dev/null 2>&1; then
      tmux source-file "$HOME/.config/tmux/tmux.conf" && echo reloaded
    fi
  register: tmux_reload
  changed_when: "'reloaded' in tmux_reload.stdout"
  failed_when: false

# Rex reads ~/.config/rex/init.lua (dotfiles .config/rex). No-op when Rex isn't
# installed or its server isn't running; rex is only on the PATH inside Rex.
- name: Reload Rex config
  ansible.builtin.shell: |
    rex="$HOME/Library/Application Support/com.superlogical.rex/RexServer/Versions/Current/Rex Server.app/Contents/MacOS/rex"
    if [ -x "$rex" ] && "$rex" --autostart=false config reload >/dev/null 2>&1; then
      echo reloaded
    fi
  register: rex_reload
  changed_when: "'reloaded' in rex_reload.stdout"
  failed_when: false

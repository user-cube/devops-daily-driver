---
- name: Tap repositories for laptop configuration tools
  community.general.homebrew_tap:
    name:
      - koekeishiya/formulae
      - jackielii/tap
    state: present
  when: window_manager == 'yabai'
  tags:
    - install
    - cli-apps

- name: Trust yabai from koekeishiya tap
  ansible.builtin.command: brew trust --formula koekeishiya/formulae/yabai
  register: yabai_trust
  changed_when: "'Trusted ' in yabai_trust.stdout"
  when: window_manager == 'yabai'
  tags:
    - install
    - cli-apps

- name: Trust skhd-zig from jackielii tap
  ansible.builtin.command: brew trust --cask jackielii/tap/skhd-zig
  register: skhd_trust
  changed_when: "'Trusted ' in skhd_trust.stdout"
  when: window_manager == 'yabai'
  tags:
    - install
    - cli-apps

- name: Install laptop configuration tools
  community.general.homebrew:
    name:
      - fzf
      - zoxide
    state: present
  tags:
    - install
    - cli-apps

- name: Install yabai
  community.general.homebrew:
    name: koekeishiya/formulae/yabai
    state: present
  when: window_manager == 'yabai'
  notify:
    - Start Yabai
  tags:
    - install
    - cli-apps

- name: Install AeroSpace
  community.general.homebrew_cask:
    name: nikitabobko/tap/aerospace
    state: present
  when: window_manager == 'aerospace'
  tags:
    - install
    - cli-apps
    - aerospace

- name: Install skhd-zig
  community.general.homebrew_cask:
    name: jackielii/tap/skhd-zig
    state: present
  when: window_manager == 'yabai'
  notify:
    - Start skhd-zig
  tags:
    - install
    - cli-apps

# The Start handlers only fire when the install task reports a change, so on a
# machine where the window manager is already installed nothing ever starts it.
# These tasks make "running" the desired state rather than a side effect.
- name: Check whether yabai is running
  ansible.builtin.command: pgrep -x yabai
  register: yabai_running
  changed_when: false
  failed_when: false
  check_mode: false
  when: window_manager == 'yabai'
  tags:
    - install
    - cli-apps

- name: Start yabai service
  ansible.builtin.command: yabai --start-service
  when: window_manager == 'yabai' and yabai_running.rc != 0
  changed_when: true
  tags:
    - install
    - cli-apps

- name: Check whether skhd is running
  ansible.builtin.command: pgrep -x skhd
  register: skhd_running
  changed_when: false
  failed_when: false
  check_mode: false
  when: window_manager == 'yabai'
  tags:
    - install
    - cli-apps

- name: Start skhd service
  ansible.builtin.command: skhd --start-service
  when: window_manager == 'yabai' and skhd_running.rc != 0
  changed_when: true
  tags:
    - install
    - cli-apps

- name: Check whether AeroSpace is running
  ansible.builtin.command: pgrep -x AeroSpace
  register: aerospace_running
  changed_when: false
  failed_when: false
  check_mode: false
  when: window_manager == 'aerospace'
  tags:
    - install
    - cli-apps
    - aerospace

- name: Start AeroSpace
  ansible.builtin.command: open -a AeroSpace
  when: window_manager == 'aerospace' and aerospace_running.rc != 0
  changed_when: true
  tags:
    - install
    - cli-apps
    - aerospace

- name: Tap FelixKratz formulae (JankyBorders, SketchyBar)
  community.general.homebrew_tap:
    name: FelixKratz/formulae
    state: present
  tags:
    - install
    - cli-apps
    - aerospace

- name: Trust borders and sketchybar from FelixKratz tap
  ansible.builtin.command: brew trust --formula felixkratz/formulae/{{ item }}
  loop: "{{ felixkratz_tools }}"
  register: felixkratz_trust
  changed_when: "'Trusted ' in felixkratz_trust.stdout"
  tags:
    - install
    - cli-apps
    - aerospace

- name: Install borders (focused window highlight) and sketchybar (status bar)
  community.general.homebrew:
    name: "{{ felixkratz_tools | map('regex_replace', '^', 'felixkratz/formulae/') | list }}"
    state: present
  tags:
    - install
    - cli-apps
    - aerospace

- name: Check whether borders and sketchybar are running
  ansible.builtin.command: pgrep -x {{ item }}
  loop: "{{ felixkratz_tools }}"
  register: felixkratz_running
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - install
    - cli-apps
    - aerospace

- name: Start borders and sketchybar services
  ansible.builtin.command: brew services start {{ item.item }}
  loop: "{{ felixkratz_running.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true
  tags:
    - install
    - cli-apps
    - aerospace

- name: Install text interaction tools
  community.general.homebrew:
    name:
      - bat
      - jq
      - yq
      - ripgrep
      - yamllint
    state: present
  tags:
    - install
    - cli-apps

- name: Install linters and formatters
  community.general.homebrew:
    name:
      - shellcheck
      - shfmt
      - pylint
      - black
      - prettier
      - stylua
    state: present
  tags:
    - install
    - cli-apps
    - linters

- name: Monitoring tools
  community.general.homebrew:
    name:
      - htop
      - btop
    state: present
  tags:
    - install
    - cli-apps

- name: Install homebrew packages
  community.general.homebrew:
    name:
      - tree
      - watch
      - direnv
      - go-task
      - asciinema
      - yazi
      - kubectx
    state: present
  tags:
    - install
    - cli-apps

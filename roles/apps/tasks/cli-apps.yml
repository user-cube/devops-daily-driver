- name: Tap repositories for laptop configuration tools
  community.general.homebrew_tap:
    name:
      - koekeishiya/formulae
      - jackielii/tap
    state: present
  tags:
    - install
    - cli-apps

- name: Trust yabai from koekeishiya tap
  ansible.builtin.command: brew trust --formula koekeishiya/formulae/yabai
  register: yabai_trust
  changed_when: "'Trusted ' in yabai_trust.stdout"
  tags:
    - install
    - cli-apps

- name: Trust skhd-zig from jackielii tap
  ansible.builtin.command: brew trust --cask jackielii/tap/skhd-zig
  register: skhd_trust
  changed_when: "'Trusted ' in skhd_trust.stdout"
  tags:
    - install
    - cli-apps

- name: Install laptop configuration tools
  community.general.homebrew:
    name:
      - koekeishiya/formulae/yabai
      - fzf
      - zoxide
    state: present
  notify:
    - Start Yabai
  tags:
    - install
    - cli-apps

- name: Install skhd-zig
  community.general.homebrew_cask:
    name: jackielii/tap/skhd-zig
    state: present
  notify:
    - Start skhd-zig
  tags:
    - install
    - cli-apps

- name: Install text interaction tools
  community.general.homebrew:
    name:
      - bat
      - jq
      - yq
      - ripgrep
      - yamllint
    state: present
  tags:
    - install
    - cli-apps

- name: Install linters and formatters
  community.general.homebrew:
    name:
      - shellcheck
      - shfmt
      - pylint
      - black
      - prettier
      - stylua
    state: present
  tags:
    - install
    - cli-apps
    - linters

- name: Monitoring tools
  community.general.homebrew:
    name:
      - htop
      - btop
    state: present
  tags:
    - install
    - cli-apps

- name: Install homebrew packages
  community.general.homebrew:
    name:
      - tree
      - watch
      - direnv
      - go-task
      - asciinema
      - yazi
      - kubectx
    state: present
  tags:
    - install
    - cli-apps
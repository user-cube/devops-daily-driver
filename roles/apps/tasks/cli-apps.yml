---
- name: Install laptop configuration tools
  community.general.homebrew:
    name:
      - fzf
      - zoxide
    state: present
  tags:
    - install
    - cli-apps

- name: Install AeroSpace
  community.general.homebrew_cask:
    name: nikitabobko/tap/aerospace
    state: present
  tags:
    - install
    - cli-apps
    - aerospace

- name: Install glow (cheat sheet, alt-i) and lazygit (tmux popup, cmd-g)
  community.general.homebrew:
    name:
      - glow
      - lazygit
    state: present
  tags:
    - install
    - cli-apps
    - aerospace

# "Running" is the desired state, not a side effect of the install reporting a
# change, so an already-installed AeroSpace is still started.
- name: Check whether AeroSpace is running
  ansible.builtin.command: pgrep -x AeroSpace
  register: aerospace_running
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - install
    - cli-apps
    - aerospace

- name: Start AeroSpace
  ansible.builtin.command: open -a AeroSpace
  when: aerospace_running.rc != 0
  changed_when: true
  tags:
    - install
    - cli-apps
    - aerospace

- name: Tap FelixKratz formulae (JankyBorders, SketchyBar)
  community.general.homebrew_tap:
    name: FelixKratz/formulae
    state: present
  tags:
    - install
    - cli-apps
    - aerospace

- name: Trust borders and sketchybar from FelixKratz tap
  ansible.builtin.command: brew trust --formula felixkratz/formulae/{{ item }}
  loop: "{{ felixkratz_tools }}"
  register: felixkratz_trust
  changed_when: "'Trusted ' in felixkratz_trust.stdout"
  tags:
    - install
    - cli-apps
    - aerospace

- name: Install borders (focused window highlight) and sketchybar (status bar)
  community.general.homebrew:
    name: "{{ felixkratz_tools | map('regex_replace', '^', 'felixkratz/formulae/') | list }}"
    state: present
  tags:
    - install
    - cli-apps
    - aerospace

- name: Check whether borders and sketchybar are running
  ansible.builtin.command: pgrep -x {{ item }}
  loop: "{{ felixkratz_tools }}"
  register: felixkratz_running
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - install
    - cli-apps
    - aerospace

- name: Start borders and sketchybar services
  ansible.builtin.command: brew services start {{ item.item }}
  loop: "{{ felixkratz_running.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true
  tags:
    - install
    - cli-apps
    - aerospace

- name: Install text interaction tools
  community.general.homebrew:
    name:
      - bat
      - jq
      - yq
      - ripgrep
      # fd: Telescope find_files, yazi search and fzf use it when present
      - fd
      - yamllint
    state: present
  tags:
    - install
    - cli-apps

- name: Install linters and formatters
  community.general.homebrew:
    name:
      - shellcheck
      - shfmt
      - pylint
      - black
      - prettier
      - stylua
    state: present
  tags:
    - install
    - cli-apps
    - linters

- name: Monitoring tools
  community.general.homebrew:
    name:
      - htop
      - btop
    state: present
  tags:
    - install
    - cli-apps

- name: Install homebrew packages
  community.general.homebrew:
    name:
      - tree
      - watch
      - direnv
      - go-task
      - asciinema
      - yazi
      - kubectx
    state: present
  tags:
    - install
    - cli-apps

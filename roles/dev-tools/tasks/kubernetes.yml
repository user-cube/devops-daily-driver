---
- name: Install cluster visualization tools - UI
  community.general.homebrew_cask:
    name:
      - headlamp
      - freelens
    state: present
  tags:
    - install
    - cluster-visualization

- name: Install cluster visualization tools - CLI
  community.general.homebrew:
    name:
      - k9s
      - stern
    state: present
  tags:
    - install
    - cluster-visualization

- name: Kubernetes CLI tools
  community.general.homebrew:
    name:
      - kubectl
      - helm
      - helm-docs
      - kyverno
      - kubeconform
      - kubecolor
      - dyff # YAML diff by structure: helm template before / after a values change
    state: present
  tags:
    - install
    - kubernetes-cli-tools

- name: Install helmfile (optional)
  community.general.homebrew:
    name: helmfile
    state: present
  when: install_helmfile | bool
  tags:
    - install
    - kubernetes-cli-tools

- name: Tap Robusta (krr)
  community.general.homebrew_tap:
    name: robusta-dev/krr
    state: present
  tags:
    - install
    - kubernetes-cli-tools
    - krr

# krr: CPU/memory requests and limits recommendations from Prometheus usage
- name: Install krr
  community.general.homebrew:
    name: robusta-dev/krr/krr
    state: present
  tags:
    - install
    - kubernetes-cli-tools
    - krr

- name: Install kubelogin (OIDC login plugin for kubectl)
  community.general.homebrew:
    name: kubelogin
    state: present
  when: install_kubelogin | bool
  tags:
    - install
    - kubernetes-cli-tools
    - kubelogin

---
- name: Install cluster visualization tools - UI
  community.general.homebrew_cask:
    name:
      - headlamp
      - freelens
    state: present
  tags:
    - install
    - cluster-visualization

- name: Install cluster visualization tools - CLI
  community.general.homebrew:
    name:
      - k9s
      - stern
    state: present
  tags:
    - install
    - cluster-visualization

- name: Kubernetes CLI tools
  community.general.homebrew:
    name:
      - kubectl
      - helm
      - helm-docs
      - kyverno
      - kubeconform
      - kubecolor
      - dyff # YAML diff by structure: helm template before / after a values change
      - popeye # cluster sanitizer: missing limits / probes, latest tags, orphans
      - pluto # deprecated / removed apiVersions, in manifests and Helm releases
      - logcli # LogQL against Loki (the dotfiles' logcli port-forwards to it)
    state: present
  tags:
    - install
    - kubernetes-cli-tools

- name: Install helmfile (optional)
  community.general.homebrew:
    name: helmfile
    state: present
  when: install_helmfile | bool
  tags:
    - install
    - kubernetes-cli-tools

- name: Tap Robusta (krr)
  community.general.homebrew_tap:
    name: robusta-dev/krr
    state: present
  tags:
    - taps # the CI check mode taps them for real first (check-mode.yml)
    - install
    - kubernetes-cli-tools
    - krr

# krr: CPU/memory requests and limits recommendations from Prometheus usage
- name: Install krr
  community.general.homebrew:
    name: robusta-dev/krr/krr
    state: present
  tags:
    - install
    - kubernetes-cli-tools
    - krr

# krew: kubectl's plugin manager. Its plugins go to ~/.krew/bin, which the
# dotfiles .zshrc puts on PATH (krew_plugins in defaults/main.yml)
- name: Install krew
  community.general.homebrew:
    name: krew
    state: present
  tags:
    - install
    - kubernetes-cli-tools
    - krew

- name: Install kubectl plugins with krew
  ansible.builtin.command: kubectl krew install {{ item }}
  args:
    creates: "{{ lookup('env', 'HOME') }}/.krew/store/{{ item }}"
  loop: "{{ krew_plugins }}"
  tags:
    - install
    - kubernetes-cli-tools
    - krew

- name: Install kubelogin (OIDC login plugin for kubectl)
  community.general.homebrew:
    name: kubelogin
    state: present
  when: install_kubelogin | bool
  tags:
    - install
    - kubernetes-cli-tools
    - kubelogin

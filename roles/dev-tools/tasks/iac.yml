---

- name: Install terraform
  community.general.homebrew:
    name:
      - terraform-docs
      - terraform-ls
      - tenv
      - ansible-lint
    state: present
  tags:
    - install
    - iac
    - terraform

- name: Install tfsec (optional; trivy config covers it)
  community.general.homebrew:
    name: tfsec
    state: present
  when: install_tfsec | bool
  tags:
    - install
    - iac
    - terraform

- name: Install tflint
  community.general.homebrew_cask:
    name: terraform-linters/tap/tflint
    state: present
  tags:
    - install
    - iac
    - terraform

- name: Install secrets management tools
  community.general.homebrew:
    name:
      - age
      - sops
      - bitwarden-cli # `bw`, used for secrets on demand (dotfiles README)
    state: present
  tags:
    - install
    - iac
    - secrets

- name: Install opentofu language server
  community.general.homebrew:
    name: tofu-ls
    state: present
  tags:
    - install
    - iac
    - opentofu

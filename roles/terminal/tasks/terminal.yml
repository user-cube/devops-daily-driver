---
- name: Install tmux and tmux-fingers (⌘Y, copy with hints)
  community.general.homebrew:
    name:
      - tmux
      - tmux-fingers
    state: present
  tags:
    - install
    - terminal
    - tmux
    - aerospace

# tmux plugins (tmux-resurrect, tmux-continuum, tmux-fzf-url), pinned to a commit.
# tmux.conf in dotfiles loads them with run-shell.
- name: Install tmux plugins at pinned commits
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ tmux_plugins_dir }}/{{ item.name }}"
    version: "{{ item.version }}"
  loop: "{{ tmux_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload tmux config
  tags:
    - install
    - terminal
    - tmux
    - aerospace

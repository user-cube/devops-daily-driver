---
- name: Install Oh My Zsh
  ansible.builtin.shell: |
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc
  args:
    creates: "{{ lookup('env', 'HOME') }}/.oh-my-zsh"
  tags:
    - install
    - zsh

- name: Download powerlevel10k theme
  ansible.builtin.git:
    repo: "{{ zsh_theme_repo }}"
    dest: "{{ zsh_theme_dest }}"
    depth: 1
  tags:
    - install
    - zsh

# zsh plugins (zsh-autosuggestions, zsh-syntax-highlighting, fzf-tab), pinned
# to a commit, into Oh My Zsh's custom/plugins (not Homebrew: .zshrc loads them
# as Oh My Zsh plugins, in its order)
- name: Install zsh plugins at pinned commits
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ zsh_plugins_dir }}/{{ item.name }}"
    version: "{{ item.version }}"
  loop: "{{ zsh_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - install
    - zsh

- name: Install pyenv
  community.general.homebrew:
    name: pyenv
    state: present
  tags:
    - install
    - zsh
    - pyenv

# pipx: Python CLI tools, each in its own virtualenv
- name: Install pipx
  community.general.homebrew:
    name: pipx
    state: present
  tags:
    - install
    - zsh
    - pipx

- name: Install nvm
  ansible.builtin.shell: |
    set -o pipefail
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
  args:
    executable: /bin/bash
    creates: "{{ lookup('env', 'HOME') }}/.nvm/nvm.sh"
  tags:
    - install
    - zsh
    - nvm

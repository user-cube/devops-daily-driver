---
home_dir: "{{ lookup('env', 'HOME') }}"
zsh_theme_repo: "https://github.com/romkatv/powerlevel10k.git"
zsh_theme_dest: "{{ home_dir }}/powerlevel10k"
# zsh plugins: cloned at pinned commits into Oh My Zsh's custom/plugins, where
# the plugins=(...) list of .zshrc in dotfiles finds them
zsh_plugins_dir: "{{ home_dir }}/.oh-my-zsh/custom/plugins"
zsh_plugins:
  - name: zsh-autosuggestions # v0.7.1 + 6
    repo: https://github.com/zsh-users/zsh-autosuggestions
    version: 85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5
  - name: zsh-syntax-highlighting # 0.8.0 + 4
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    version: e6683f20e5c38d3e5447f45845d04ddda75d0f23
  - name: fzf-tab # v1.3.0; Tab completes in an fzf list (loaded once this folder exists)
    repo: https://github.com/Aloxaf/fzf-tab.git
    version: 24105b15714bfec37989ed5c5b6e60f572253019
fonts_base_url: "https://github.com/romkatv/powerlevel10k-media/raw/master"
fonts_dest_dir: "{{ home_dir }}/Library/Fonts"
fonts_meslo_files:
  - "MesloLGS NF Regular.ttf"
  - "MesloLGS NF Bold.ttf"
  - "MesloLGS NF Italic.ttf"
  - "MesloLGS NF Bold Italic.ttf"
# tmux plugins (no TPM): cloned at pinned commits into ~/.config/tmux/plugins
tmux_plugins_dir: "{{ home_dir }}/.config/tmux/plugins"
tmux_plugins:
  - name: tmux-resurrect
    repo: https://github.com/tmux-plugins/tmux-resurrect.git
    version: cff343cf9e81983d3da0c8562b01616f12e8d548
  - name: tmux-continuum
    repo: https://github.com/tmux-plugins/tmux-continuum.git
    version: 0698e8f4b17d6454c71bf5212895ec055c578da0
  - name: tmux-fzf-url # ⌘U: open a URL from the pane
    repo: https://github.com/wfxr/tmux-fzf-url.git
    version: 7c4838e95fde660b7f2aaf514323ac8498e0d4f4

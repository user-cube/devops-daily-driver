---
- name: Install Containerization tools
  community.general.homebrew:
    name:
      - colima
      - docker
      - docker-compose
      - docker-buildx
      - docker-credential-helper
      - qemu
      - lima-additional-guestagents
      - hadolint
      - dive # an image's layers and what each one adds (k9s Ctrl-I on a container)
    state: present

# The 'work' profile is only created (first run); it is never started on later
# runs, so a stopped VM stays stopped. Start it with `colima start work`.
- name: Check whether the Colima 'work' profile exists
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.colima/_lima/colima-work"
  register: colima_work_profile
  tags:
    - virtualization
    - colima

- name: Create the Colima 'work' profile (left stopped)
  ansible.builtin.shell: |
    colima start --vm-type=vz --vz-rosetta --memory 8 work
    colima stop work
  when: not colima_work_profile.stat.exists
  changed_when: true
  tags:
    - virtualization
    - colima

- name: Create Docker CLI plugin directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.docker/cli-plugins"
    state: directory
    mode: '0755'
  tags:
    - virtualization
    - docker-buildx

# Homebrew's docker-buildx (checksum-verified, updated by `brew upgrade`) lives
# outside Docker's plugin path; a symlink makes `docker buildx` find it without
# editing ~/.docker/config.json.
- name: Link Docker Buildx plugin from Homebrew
  ansible.builtin.file:
    src: /opt/homebrew/lib/docker/cli-plugins/docker-buildx
    dest: "{{ lookup('env', 'HOME') }}/.docker/cli-plugins/docker-buildx"
    state: link
    force: true
  tags:
    - virtualization
    - docker-buildx

- name: LazyDocker
  community.general.homebrew:
    name: lazydocker
    state: present
  tags:
    - virtualization
    - lazydocker

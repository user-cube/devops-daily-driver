---
- name: Install Containerization tools
  community.general.homebrew:
    name:
      - colima
      - docker
      - docker-compose
      - docker-credential-helper
      - qemu
      - lima-additional-guestagents
      - hadolint
    state: present

# The 'work' profile is only created (first run); it is never started on later
# runs, so a stopped VM stays stopped. Start it with `colima start work`.
- name: Check whether the Colima 'work' profile exists
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.colima/_lima/colima-work"
  register: colima_work_profile
  tags:
    - virtualization
    - colima

- name: Create the Colima 'work' profile (left stopped)
  ansible.builtin.shell: |
    colima start --vm-type=vz --vz-rosetta --memory 8 work
    colima stop work
  when: not colima_work_profile.stat.exists
  changed_when: true
  tags:
    - virtualization
    - colima

- name: Get latest release from GitHub API
  uri:
    url: https://api.github.com/repos/docker/buildx/releases/latest
    return_content: true
  register: github_release
  check_mode: false

- name: Set latest version and download URL for macOS ARM64
  set_fact:
    buildx_version: "{{ github_release.json.tag_name }}"
    buildx_download_url: >-
      {{ github_release.json.assets
        | selectattr('name', 'match', '.*darwin-arm64$')
        | map(attribute='browser_download_url')
        | list
        | first }}
  tags:
    - virtualization
    - docker-buildx

- name: Create Docker CLI plugin directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.docker/cli-plugins"
    state: directory
    mode: '0755'
  tags:
    - virtualization
    - docker-buildx

- name: Download Docker Buildx binary for macOS ARM64
  get_url:
    url: "{{ buildx_download_url }}"
    dest: "{{ lookup('env', 'HOME') }}/.docker/cli-plugins/docker-buildx"
    mode: '0755'
  tags:
    - virtualization
    - docker-buildx

- name: LazyDocker
  community.general.homebrew:
    name: lazydocker
    state: present
  tags:
    - virtualization
    - lazydocker

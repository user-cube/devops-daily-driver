---
- name: Install MacOS Applications for Daily Driver Use
  hosts: localhost

  # Some casks ship their own installers that call sudo. brew runs as the normal
  # user, so the password has to be handed to those tasks explicitly.
  vars_prompt:
    - name: mac_sudo_password
      prompt: "sudo password (casks with own installers; enter to skip)"
      private: true
      default: ""

  roles:
    - role: system
      tags:
        - system
        - preflight
        - directories
        - dotfiles

    - role: macos
      tags:
        - macos
        - dock
        - menubar
        - finder
        - keyboard

    - role: apps
      tags:
        - apps
        - ui-apps
        - cli-apps
        - documentation-tools
        - networking

    - role: aws
      tags:
        - aws

    - role: azure
      tags:
        - azure

    - role: gcp
      tags:
        - gcp

    - role: dev-tools
      tags:
        - dev-tools
        - git-tools
        - gh-cli
        - golang
        - golang-tools
        - cicd
        - kubernetes
        - node
        - ios

    - role: virtualization
      tags:
        - virtualization

    - role: editors
      tags:
        - editors

    - role: terminal
      tags:
        - terminal
        - ghostty
        - zsh
        - fonts
        - nvim

    - role: custom-tools
      tags:
        - custom-tools
        - demo

  # Runs after every role so AeroSpace and sketchybar are already installed.
  # Interactive (waits for Enter), so it only runs when asked for explicitly:
  #   --tags permissions   or   --tags aerospace
  post_tasks:
    - name: Guide through privacy permissions (Accessibility, Automation)
      ansible.builtin.import_role:
        name: macos
        tasks_from: permissions
      tags:
        - never
        - aerospace
        - permissions

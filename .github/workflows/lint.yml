---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: yamllint + ansible-lint + syntax-check + pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install -r requirements-ci.txt

      # Galaxy now and then answers 500: the collections come from the cache,
      # and Galaxy is only asked when requirements.yml changes (a new key)
      - name: Cache collections
        id: galaxy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install collections
        if: steps.galaxy.outputs.cache-hit != 'true'
        run: scripts/install-collections.sh # Galaxy, else the same versions from GitHub

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      # Catches undefined vars in task args and broken includes. The whole
      # playbook runs in --check mode on macOS in check-mode.yml
      - name: Syntax check
        run: ansible-playbook --syntax-check daily-driver.yml

      # tests/: the tags the README lists, the roles' READMEs, the pinned
      # plugins and Renovate's regex for them, the pinned versions
      - name: pytest
        run: pytest tests/ -q
